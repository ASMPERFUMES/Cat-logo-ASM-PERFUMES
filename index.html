<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASMperfumes - Catálogo de Perfumes</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --fondo-crema: #F5EFEB;
            --blanco-tarjeta: #FFFFFF;
            --texto-principal: #2B231A;
            --bronce-acento: #8C7355;
            --bronce-oscuro: #6E583E;
            --borde-suave: #E0D7CD;
            --filtro-inactivo: #EAE3DA;
            --subtitulo-gris: #887F75;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--fondo-crema); 
            color: var(--texto-principal); 
            padding-bottom: 50px;
        }

        header { 
            background-color: var(--fondo-crema);
            text-align: center; 
            padding: 35px 20px 15px 20px; 
        }

        header .subtitle-top { 
            font-size: 0.75rem; 
            color: var(--subtitulo-gris); 
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        header h1 { 
            font-family: 'Playfair Display', serif; 
            font-size: 2.2rem; 
            font-weight: 600;
            color: var(--texto-principal);
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        header .subtitle-bottom { 
            font-size: 0.85rem; 
            color: var(--subtitulo-gris); 
        }

        .filters { 
            display: flex; 
            justify-content: center; 
            gap: 12px; 
            padding: 15px 10px; 
            background-color: var(--fondo-crema); 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }

        .filter-btn { 
            background: var(--filtro-inactivo); 
            border: 1px solid transparent; 
            color: var(--bronce-oscuro); 
            padding: 8px 22px; 
            border-radius: 20px; 
            font-size: 0.8rem; 
            font-weight: 500; 
            cursor: pointer; 
            transition: all 0.2s ease;
            font-family: 'Montserrat', sans-serif;
        }

        .filter-btn.active, .filter-btn:hover { 
            background: var(--bronce-acento); 
            color: #FFFFFF; 
        }

        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 10px 15px 30px 15px; 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 20px; 
        }

        .card { 
            background: var(--blanco-tarjeta); 
            border-radius: 10px; 
            overflow: hidden; 
            border: 1px solid var(--borde-suave); 
            box-shadow: 0 2px 8px rgba(0,0,0,0.03); 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            transition: transform 0.2s ease;
        }

        .card-img { 
            width: 100%; 
            height: 270px; 
            object-fit: contain; 
            background: #FFFFFF; 
            padding: 20px; 
        }

        .card-header { 
            padding: 10px 15px 5px 15px; 
            text-align: center;
        }

        .badge { 
            display: inline-block;
            font-size: 0.68rem; 
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 1.5px;
            color: var(--subtitulo-gris);
            margin-bottom: 6px;
        }

        .card-title { 
            font-family: 'Playfair Display', serif; 
            font-size: 1.15rem; 
            color: var(--texto-principal); 
            font-weight: 600;
            line-height: 1.3;
        }

        .card-body { 
            padding: 10px 15px 15px 15px; 
            font-size: 0.8rem; 
            flex-grow: 1; 
        }

        .notes-block { 
            margin-bottom: 10px; 
            background: var(--fondo-crema);
            padding: 10px;
            border-radius: 6px;
        }

        .notes-label { 
            font-weight: 600; 
            color: var(--bronce-oscuro); 
            display: block; 
            margin-bottom: 3px; 
            font-size: 0.72rem;
            text-transform: uppercase;
        }

        .notes-block p {
            color: var(--texto-principal);
            line-height: 1.35;
            font-size: 0.78rem;
        }

        .info-row { 
            display: flex; 
            justify-content: space-between; 
            margin-top: 6px; 
            padding-top: 6px; 
            border-top: 1px dashed var(--borde-suave); 
            font-size: 0.75rem; 
            color: var(--subtitulo-gris);
        }

        .info-row strong {
            color: var(--texto-principal);
        }

        .card-footer { 
            padding: 12px 15px 15px 15px; 
            background-color: var(--blanco-tarjeta); 
        }

        .btn-whatsapp { 
            display: block; 
            width: 100%; 
            padding: 11px; 
            background-color: var(--bronce-acento); 
            color: #FFFFFF; 
            text-align: center; 
            text-decoration: none; 
            font-weight: 500; 
            font-size: 0.8rem; 
            border-radius: 6px; 
            letter-spacing: 1px;
            transition: background 0.2s ease;
        }

        .btn-whatsapp:hover {
            background-color: var(--bronce-oscuro);
        }
    </style>
</head>
<body>
    <header>
        <div class="subtitle-top">CATÁLOGO DE PERFUMES</div>
        <h1>ASMperfumes</h1>
        <div class="subtitle-bottom">Fragancias seleccionadas</div>
    </header>
    <div class="filters">
        <button class="filter-btn active" onclick="filterPerfumes('todos')">Todos</button>
        <button class="filter-btn" onclick="filterPerfumes('femenino')">Mujer</button>
        <button class="filter-btn" onclick="filterPerfumes('masculino')">Hombre</button>
        <button class="filter-btn" onclick="filterPerfumes('unisex')">Unisex</button>
    </div>
    <div class="container" id="perfume-container"></div>

    <script>
        const PHONE_NUMBER = "573018738631"; 
        const perfumes = [
            { id: 1, nombre: "Fakhar Lattafa Gold Extrait", genero: "unisex", notas: "Nardos, notas solares, cáshmeran, haba tonka y ámbar.", ocasion: "Eventos Elegantes / Noche", fijacion: "Extrema (12+ hrs)", img: "fakhar.jpg" },
            { id: 2, nombre: "Lattafa Khamrah", genero: "unisex", notas: "Canela, nuez moscada, praliné, fechas, vainilla y tonka.", ocasion: "Citas / Noches Frescas", fijacion: "Muy Alta (10-12 hrs)", img: "KHAMRAH.JPG" },
            { id: 3, nombre: "Lattafa Khamrah Dukhan", genero: "unisex", notas: "Ámbar denso, notas ahumadas, especias cálidas y maderas.", ocasion: "Eventos Nocturnos Exclusivos", fijacion: "Extrema (12+ hrs)", img: "KHAMRAHDUKHAN.JPG" },
            { id: 4, nombre: "Maison Alhambra Philos Rosso", genero: "unisex", notas: "Rosa, davana, pachulí, clavo, pino y ámbar gris.", ocasion: "Citas / Ocasiones Especiales", fijacion: "Alta (8-10 hrs)", img: "PHILOSROSSO.JPG" },
            { id: 5, nombre: "Afnan 9 PM Elixir", genero: "masculino", notas: "Especias finas, maderas profundas, cuero y ámbar.", ocasion: "Fiestas / Salidas Nocturnas", fijacion: "Extrema (12+ hrs)", img: "9PMELIXIR.JPG" },
            { id: 6, nombre: "Rasasi Hawas for Him", genero: "masculino", notas: "Manzana, bergamota, canela, notas marinas y ámbar gris.", ocasion: "Uso Diario / Climas Cálidos", fijacion: "Alta (8-10 hrs)", img: "HAWAS.JPG" },
            { id: 7, nombre: "Nautica Classic", genero: "masculino", notas: "Bergamota, limón, estragón, salvia y sándalo.", ocasion: "Uso Diario / Casual", fijacion: "Moderada (6-8 hrs)", img: "NAUTICA.JPG" },
            { id: 8, nombre: "Armaf Legasi Pour Femme", genero: "femenino", notas: "Frutas rojas, jazmín, rosa, ámbar y almizcle.", ocasion: "Oficina / Reuniones Elegantes", fijacion: "Alta (8-10 hrs)", img: "LEGASI.JPG" },
            { id: 9, nombre: "Pepe Jeans For Her", genero: "femenino", notas: "Almendra, leche de coco, marshmallow, vainilla y vodka.", ocasion: "Fiestas / Salidas Juveniles", fijacion: "Alta (8-10 hrs)", img: "PEPEJEANS.JPG" },
            { id: 10, nombre: "Lattafa Noble Blush (Badee Al Oud)", genero: "femenino", notas: "Leche de rosas, merengue, almendra, vainilla y sándalo.", ocasion: "Citas / Eventos de Día", fijacion: "Muy Alta (10-12 hrs)", img: "NOBLEBLUSH.JPG" },
            { id: 11, nombre: "Armaf Odyssey Artisto (Red Edition)", genero: "masculino", notas: "Cítricos luminosos, especias picantes, lavanda y madera.", ocasion: "Uso Diario Versátil / Noche", fijacion: "Alta (8-10 hrs)", img: "ODYSSEYRED.JPG" },
            { id: 12, nombre: "Afnan Lynked Freedom", genero: "unisex", notas: "Notas verdes, cítricos, hierbas aromáticas y madera fina.", ocasion: "Casual / Oficina / Día", fijacion: "Alta (8-10 hrs)", img: "LYNKEDFREEDOM.JPG" },
            { id: 13, nombre: "Armaf Ventana Pour Homme", genero: "masculino", notas: "Toronja, bergamota, lavanda, pachulí y cedro.", ocasion: "Trabajo / Citas Casuales", fijacion: "Alta (8-10 hrs)", img: "VENTANA.JPG" },
            { id: 14, nombre: "Lattafa The Kingdom", genero: "femenino", notas: "Flor de azahar, jazmín, vainilla cremosa y ámbar dulce.", ocasion: "Eventos Especiales / Noche", fijacion: "Muy Alta (10-12 hrs)", img: "THEKINGDOM.JPG" },
            { id: 15, nombre: "Armaf Odyssey Eau De Montagne", genero: "unisex", notas: "Notas acuáticas, té verde, bergamota, sándalo y almizcle.", ocasion: "Días Cálidos / Aire Libre", fijacion: "Moderada (6-8 hrs)", img: "EAUDEMONTAGNE.JPG" },
            { id: 16, nombre: "Lattafa Habik", genero: "unisex", notas: "Ámbar oriental, resinas valiosas, flores oscuras y madera.", ocasion: "Gala / Citas Románticas", fijacion: "Extrema (12+ hrs)", img: "HABIK.JPG" },
            { id: 17, nombre: "Armaf Odyssey Mandarin Sky Elixir", genero: "masculino", notas: "Mandarina jugosa, caramelo, haba tonka, salvia y vetiver.", ocasion: "Salidas Nocturnas / Fiestas", fijacion: "Muy Alta (10-12 hrs)", img: "MANDARINSKY.JPG" }
        ];

        function renderPerfumes(data) {
            const container = document.getElementById('perfume-container');
            container.innerHTML = '';
            data.forEach(p => {
                const textMsg = encodeURIComponent(`¡Hola ASMperfumes! Quisiera consultar la disponibilidad de: ${p.nombre}`);
                const waUrl = `https://wa.me/${PHONE_NUMBER}?text=${textMsg}`;
                const generoTag = p.genero === 'femenino' ? 'MUJER' : (p.genero === 'masculino' ? 'HOMBRE' : 'UNISEX');
                
                container.innerHTML += `
                    <div class="card">
                        <img src="${p.img}" alt="${p.nombre}" class="card-img">
                        <div class="card-header">
                            <span class="badge">${generoTag}</span>
                            <h2 class="card-title">${p.nombre}</h2>
                        </div>
                        <div class="card-body">
                            <div class="notes-block">
                                <span class="notes-label">Notas Olfativas</span>
                                <p>${p.notas}</p>
                            </div>
                            <div class="info-row"><span>Uso:</span> <strong>${p.ocasion}</strong></div>
                            <div class="info-row"><span>Fijación:</span> <strong>${p.fijacion}</strong></div>
                        </div>
                        <div class="card-footer">
                            <a href="${waUrl}" target="_blank" class="btn-whatsapp">Consultar por WhatsApp</a>
                        </div>
                    </div>`;
            });
        }

        function filterPerfumes(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderPerfumes(category === 'todos' ? perfumes : perfumes.filter(p => p.genero === category));
        }

        renderPerfumes(perfumes);
    </script>
</body>
</html>
